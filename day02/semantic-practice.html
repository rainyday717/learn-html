<!DOCTYPE html>
<html lang="ko-KR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>신재훈 학습 블로그</title>
    <style>

        html{
            scroll-behavior: smooth;
        }

        section{
            height: 100vh;
            border: 1px solid black;
        }

    </style>
</head>
<body>
    
    <header> 
        <h1>오늘 배운 내용 간단 정리</h1>
        <nav>
            <h2>시맨틱 태그</h2>
            <ul>
                <li>
                    <a href="#header">header</a>
                </li>

                <li>
                    <a href="#nav">nav</a>
                </li>

                <li>
                    <a href="#main">main</a>
                </li>
            </ul>
        </nav>
    </header>

    <hr>

    <main>
        <section id="header">
            <h2>header</h2>

            <article>
                <h3>header에 대해</h3>
                <p>header는 페이지 또는 영역의 머리말을 의미한다.</p>
            </article>
        </section>

        <section id="nav">
            <h2>nav</h2>
            <article>
                <h3>nav에 대해</h3>
                <p>nav는 주요 탐색 메뉴를 나타낸다.</p>
            </article>
        </section>

        <section id="main">
            <h2>main</h2>
            <article>
                <h3>main에 대해</h3>
                <p>main은 페이지의 핵심 콘텐츠를 나타낸다.</p>
            </article>
        </section>

        <hr>

        <aside>
            <h2>더 많은 내용을 알고 싶다면?</h2>
            <p>자세한 내용은 범쌤의 학습 자료를 살펴보세요.</p>
        </aside>



        <hr>
       
        <footer>
            <p>작성자: 신재훈</p>
            <p>작성시간: <time datetime="2026-08-20">2026-08-20</time></p>
            <p>&copy; 범쌤의 HTML 기초 학습 자료</p>
        </footer>

    </main>

</body>
</html>
