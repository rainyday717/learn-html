<!DOCTYPE html>
<html lang="ko-KR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>form 관련 태그 학습</title>
</head>
<body>
    
    <label for="user-name">이름: </label>
    <input type="text" id="user-name"/>


    <label for="male">남성: </label>
    <input type="radio" name="gender-select" id="male"/>

    <label for="female">여성: </label>
    <input type="radio" name="gender-select" id="female"/>

    <hr/>

    <label for="checkbox">동의합니다.</label>
    <input type="checkbox" name="" id="checkbox"/>

    <hr/>

    <label for="nickname">
        이름: 
        <input type="text"/>
    </label>

    
    <hr/>

    <label for="city">화성시</label>
    <input type="text" id="city" name="city" value="병점구"/>

    <hr/>

    <div>
        <label for="checkbox2">동의합니다.</label>
        <input type="checkbox" name="" id="checkbox2" checked/>
    </div>
    
    <hr/>

    <label for="email">이메일: </label>
    <small>필수 입력사항입니다.</small>
    <input
        type="email" name="email" id="email" placeholder="hbm09040@naver.com"
        required readonly
    />

    <!-- <button type="button" >회원가입</button> -->

    <input type="tel" placeholder="010-1234-5678"/>
    <input type="search" placeholder="검색어를 입력하세요."/>
    <input type="number" placeholder="10"/>

    <hr/>

    <input type="number" id="age" name="age" min="1" max="100" step="1"/>

    <input type="range" id="volume" name="volume" min="0" max="100" value="20" />

    <hr/>

    <input type="date" name="birthDate" />
    <input type="time" name="meetingTime" />
    <input type="datetime-local" name="reservation" />
    <input type="month" name="startMonth" />
    <input type="week" name="week" />


    <hr/>

    <input
    type="color" id="theme-color"
    name="theme-color" value="000000"   />

    <input type="submit" value="가입하기"/>
    <input type="reset" value="초기화"/>
    <input type="button" value="로그인"/>

    <button type="button">로그인</button>
    <button type="submit">제출</button>

    <!-- <div role="button" tabindex="0">로그인</div> -->

    <hr/>

    <label for="introduction">자기소개</label>
    <textarea
        id="introduction"
        name="introduction"
        rows="5"
        cols="40">
    </textarea>

    <hr/>

    <select name="city2" id="city2">
        <optgroup label="수도권">
        <option value="seoul">서울 </option>

        <option value="suwon">수원</option>
        <option value="osan">오산</option>
        </optgroup>
    </select>


    <fieldset>
        <legend>수강 수준</legend>
        <label>
            <input type="radio" name="level" value="beginner"/> 초급
        </label>

        <label>
            <input type="radio" name="level" value="middle"/> 중급
        </label>
    </fieldset>

    <form action="/login">
        <label for="user-name2">이름</label>
        <input type="text" id="user-name2" name="userName2" />

        <label for="password2">비밀번호</label>
        <input type="password" id="password2" name="q" />

        <button type="submit">가입하기</button>
    </form>


</body>
</html>
